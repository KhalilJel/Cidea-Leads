[build]
  command = "npm run build"
  publish = "dist"

# The app previously served this article under a shorter slug; keep old links working.
[[redirects]]
  from = "/blog/b2b-leadgenerering"
  to = "/blog/hva-er-b2b-leadgenerering"
  status = 301

# Every route is prerendered to its own index.html at build time.
# Anything else gets the branded 404 page with a real 404 status.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
